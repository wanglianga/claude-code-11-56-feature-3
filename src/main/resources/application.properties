spring.application.name=faultref
server.port=${PORT:8080}

# --- PostgreSQL -------------------------------------------------------
# Defaults match the pre-installed container database (db/user/pass: ccdev).
# Override with DB_URL/DB_USER/DB_PASSWORD in any other environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/ccdev}
spring.datasource.username=${DB_USER:ccdev}
spring.datasource.password=${DB_PASSWORD:ccdev}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# --- Schema -----------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JSON -------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false

# --- OpenAPI / Swagger UI --------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
springdoc.default-produces-media-type=application/json

# --- Application ------------------------------------------------------
app.security.enabled=${APP_SECURITY_ENABLED:true}
app.demo.enabled=${APP_DEMO_ENABLED:true}
app.diagnosis.max-batch-size=${APP_DIAGNOSIS_MAX_BATCH:5000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
