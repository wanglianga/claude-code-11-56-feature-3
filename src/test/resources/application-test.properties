# Test profile: dedicated database so integration tests never touch dev data.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://127.0.0.1:5432/faultref_test}
spring.datasource.username=${DB_USER:ccdev}
spring.datasource.password=${DB_PASSWORD:ccdev}
spring.datasource.hikari.maximum-pool-size=4

spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration

# Each test class seeds what it needs; the shared demo dataset is disabled.
app.demo.enabled=false
# Security is ON by default; tests that don't exercise auth disable it per-class.
app.security.enabled=true
app.diagnosis.max-batch-size=500

logging.level.org.springframework.jdbc.core=WARN
